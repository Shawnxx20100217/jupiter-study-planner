name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-collector.txt
      - name: Run tests
        run: python -m unittest discover -s tests -q
      - name: Check source package
        run: python scripts/package_share.py --output /tmp/jupiter-study-planner-source.zip
      - name: Build plugin packages
        run: |
          python scripts/package_share.py --plugin jupiter-reader --output /tmp/jupiter-reader.zip
          python scripts/package_share.py --plugin ticktick-sync --output /tmp/ticktick-sync.zip
